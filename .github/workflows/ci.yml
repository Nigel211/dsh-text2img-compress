name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        # dsh rc packages have crossed peer ranges; the official repo builds with pnpm.
        run: npm ci --legacy-peer-deps
      - name: Build (host types + client bundle)
        run: npm run build
      - name: Render smoke test (needs a font on CI — Ubuntu ships DejaVu)
        run: node scripts/smoke.mjs
